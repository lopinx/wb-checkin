name: WorkBuddy 签到

on:
  schedule:
    # UTC 01:30 = 北京时间 09:30，与 wrangler.toml cron 一致
    - cron: "30 1 * * *"
  # 手动触发（对应 CF Workers 的 HTTP 手动能力）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "干跑（不实际请求签到接口）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKBUDDY: ${{ secrets.WORKBUDDY }}
      WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
      WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 签到
        run: node src/main.js ${{ inputs.dry_run == true && '--dry-run --no-notify' || '' }}
